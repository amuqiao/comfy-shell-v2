<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comfy Shell</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      body {
        margin: 0;
      }

      header {
        align-items: center;
        background: #ffffff;
        border-bottom: 1px solid #d8d9d2;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 14px 20px;
      }

      main {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
        padding: 18px 20px;
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        font-weight: 650;
      }

      h2 {
        font-size: 15px;
        margin-bottom: 10px;
      }

      h3 {
        font-size: 14px;
        margin-bottom: 8px;
      }

      button,
      input,
      select {
        border: 1px solid #b8bbb0;
        border-radius: 6px;
        font: inherit;
        min-height: 34px;
      }

      button {
        background: #263238;
        color: #ffffff;
        cursor: pointer;
        padding: 0 12px;
      }

      button.secondary {
        background: #ffffff;
        color: #202124;
      }

      input,
      select {
        background: #ffffff;
        box-sizing: border-box;
        padding: 0 9px;
        width: 100%;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
      }

      section {
        background: #ffffff;
        border: 1px solid #d8d9d2;
        border-radius: 8px;
        padding: 14px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .row {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .item {
        border: 1px solid #e1e2dc;
        border-radius: 8px;
        cursor: pointer;
        padding: 10px;
      }

      .item.active {
        border-color: #006d77;
      }

      .muted {
        color: #656861;
        font-size: 12px;
      }

      pre {
        background: #111315;
        border-radius: 8px;
        color: #f3f4ef;
        margin: 0;
        min-height: 180px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Comfy Shell</h1>
      <div class="row">
        <input id="token" type="password" placeholder="Bearer token" />
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main>
      <div class="stack">
        <section>
          <h2>Hosts</h2>
          <div id="hosts" class="list"></div>
        </section>
        <section>
          <h2>Model Roots</h2>
          <div class="stack">
            <label>Label <input id="model-label" value="Shared Models" /></label>
            <label>Path <input id="model-path" placeholder="/data/comfy-shell-v2/ComfyUI-Shared/models" /></label>
            <button id="create-model-root" type="button">Add Model Root</button>
            <div id="model-roots" class="list"></div>
          </div>
        </section>
      </div>
      <div class="stack">
        <section>
          <h2>Instances</h2>
          <div class="stack">
            <div class="row">
              <label>Name <input id="instance-name" value="Comfy Prod" /></label>
              <label>Slug <input id="instance-slug" value="comfy-prod" /></label>
              <label>Ref <input id="instance-ref" placeholder="master or tag/commit" /></label>
              <label>Port <input id="instance-port" type="number" value="8188" /></label>
            </div>
            <button id="create-instance" type="button">Create Instance</button>
            <div id="instances" class="list"></div>
          </div>
        </section>
        <section>
          <h2>Selected Instance</h2>
          <div class="row">
            <button id="install" type="button">Install</button>
            <button id="start" type="button">Start</button>
            <button id="stop" type="button">Stop</button>
            <button id="status" class="secondary" type="button">Status</button>
            <button id="ready" class="secondary" type="button">Ready</button>
            <button id="logs" class="secondary" type="button">Logs</button>
          </div>
        </section>
        <section>
          <h2>Output</h2>
          <pre id="output"></pre>
        </section>
      </div>
    </main>
    <script>
      const state = { hosts: [], modelRoots: [], instances: [], selectedHostId: null, selectedInstanceId: null };
      const apiPrefix = "__API_PREFIX__";
      const output = document.querySelector("#output");

      function headers() {
        const token = document.querySelector("#token").value;
        return { "Content-Type": "application/json", Authorization: `Bearer ${token}` };
      }

      function show(value) {
        output.textContent = JSON.stringify(value, null, 2);
      }

      async function request(path, options = {}) {
        const response = await fetch(`${apiPrefix}${path}`, { ...options, headers: headers() });
        const body = await response.json();
        show(body);
        if (!response.ok) throw new Error(body.code || response.statusText);
        return body.data;
      }

      function renderHosts() {
        document.querySelector("#hosts").innerHTML = state.hosts
          .map(
            (host) => `<div class="item ${host.id === state.selectedHostId ? "active" : ""}" data-host="${host.id}">
              <strong>${host.name}</strong>
              <div class="muted">${host.connection} | ${host.data_root}</div>
            </div>`,
          )
          .join("");
        document.querySelectorAll("[data-host]").forEach((node) => {
          node.addEventListener("click", () => {
            state.selectedHostId = node.dataset.host;
            renderHosts();
          });
        });
      }

      function renderModelRoots() {
        document.querySelector("#model-roots").innerHTML = state.modelRoots
          .map((root) => `<div class="item"><strong>${root.label}</strong><div class="muted">${root.path}</div></div>`)
          .join("");
      }

      function renderInstances() {
        document.querySelector("#instances").innerHTML = state.instances
          .map(
            (item) => `<div class="item ${item.id === state.selectedInstanceId ? "active" : ""}" data-instance="${item.id}">
              <strong>${item.name}</strong>
              <div class="muted">${item.comfy_ref} | port ${item.comfy_port} | ${item.install_root}</div>
            </div>`,
          )
          .join("");
        document.querySelectorAll("[data-instance]").forEach((node) => {
          node.addEventListener("click", () => {
            state.selectedInstanceId = node.dataset.instance;
            renderInstances();
          });
        });
      }

      async function refresh() {
        const hosts = await request("/hosts");
        state.hosts = hosts.hosts;
        state.selectedHostId = state.selectedHostId || state.hosts[0]?.id || null;
        renderHosts();
        const roots = await request(state.selectedHostId ? `/model-roots?host_id=${state.selectedHostId}` : "/model-roots");
        state.modelRoots = roots.model_roots;
        renderModelRoots();
        const instances = await request(state.selectedHostId ? `/instances?host_id=${state.selectedHostId}` : "/instances");
        state.instances = instances.instances;
        state.selectedInstanceId = state.selectedInstanceId || state.instances[0]?.id || null;
        renderInstances();
      }

      document.querySelector("#refresh").addEventListener("click", refresh);
      document.querySelector("#create-model-root").addEventListener("click", async () => {
        await request("/model-roots", {
          method: "POST",
          body: JSON.stringify({
            host_id: state.selectedHostId,
            label: document.querySelector("#model-label").value,
            path: document.querySelector("#model-path").value,
          }),
        });
        await refresh();
      });
      document.querySelector("#create-instance").addEventListener("click", async () => {
        await request("/instances", {
          method: "POST",
          body: JSON.stringify({
            host_id: state.selectedHostId,
            name: document.querySelector("#instance-name").value,
            instance_slug: document.querySelector("#instance-slug").value,
            comfy_ref: document.querySelector("#instance-ref").value || null,
            comfy_port: Number(document.querySelector("#instance-port").value),
            model_root_ids: state.modelRoots.map((item) => item.id),
          }),
        });
        await refresh();
      });
      for (const action of ["install", "start", "stop"]) {
        document.querySelector(`#${action}`).addEventListener("click", async () => {
          await request(`/instances/${state.selectedInstanceId}/${action}`, { method: "POST", body: JSON.stringify({}) });
          await refresh();
        });
      }
      for (const action of ["status", "ready", "logs"]) {
        document.querySelector(`#${action}`).addEventListener("click", async () => {
          await request(`/instances/${state.selectedInstanceId}/${action}`);
        });
      }
    </script>
  </body>
</html>
