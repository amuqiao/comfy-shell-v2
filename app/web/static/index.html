<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comfy Shell</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f6f2;
        color: #202124;
      }

      body {
        margin: 0;
      }

      header {
        align-items: center;
        background: #ffffff;
        border-bottom: 1px solid #d8d9d2;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 14px 20px;
      }

      main {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
        padding: 18px 20px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        font-weight: 650;
      }

      h2 {
        font-size: 15px;
        margin-bottom: 10px;
      }

      h3 {
        font-size: 13px;
        margin-bottom: 6px;
      }

      a {
        color: #006d77;
      }

      button,
      input,
      select {
        border: 1px solid #b8bbb0;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        min-height: 36px;
      }

      button {
        background: #263238;
        color: #ffffff;
        cursor: pointer;
        padding: 0 12px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      button.secondary {
        background: #ffffff;
        color: #202124;
      }

      input,
      select {
        background: #ffffff;
        padding: 0 9px;
        width: 100%;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
      }

      section {
        background: #ffffff;
        border: 1px solid #d8d9d2;
        border-radius: 8px;
        padding: 14px;
      }

      details {
        border-top: 1px solid #e1e2dc;
        padding-top: 10px;
      }

      summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 650;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .row {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toolbar input {
        min-width: 240px;
        width: 28vw;
      }

      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, minmax(140px, 1fr));
      }

      .grid.wide {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .item {
        border: 1px solid #e1e2dc;
        border-radius: 8px;
        cursor: pointer;
        padding: 10px;
      }

      .item.active {
        border-color: #006d77;
      }

      .muted {
        color: #656861;
        font-size: 12px;
      }

      .pill {
        background: #edf3f1;
        border: 1px solid #c9d8d3;
        border-radius: 999px;
        color: #24423c;
        display: inline-flex;
        font-size: 12px;
        line-height: 1;
        padding: 6px 8px;
      }

      .status-running {
        background: #e6f4ea;
        border-color: #b7dfc2;
        color: #185c2f;
      }

      .status-stopped {
        background: #f1f3f4;
        border-color: #d5d7da;
        color: #3c4043;
      }

      .status-not-installed,
      .status-port-busy {
        background: #fff4e5;
        border-color: #f4cf9a;
        color: #7a4a00;
      }

      .status-error,
      .status-unknown {
        background: #fce8e6;
        border-color: #f5b6b1;
        color: #8a1c13;
      }

      .kv {
        display: grid;
        gap: 6px;
      }

      .kv div {
        display: grid;
        gap: 6px;
        grid-template-columns: 108px minmax(0, 1fr);
      }

      .kv span {
        overflow-wrap: anywhere;
      }

      .selected {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      pre {
        background: #111315;
        border-radius: 8px;
        color: #f3f4ef;
        margin: 0;
        min-height: 220px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 980px) {
        .grid,
        .grid.wide {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
      }

      @media (max-width: 760px) {
        header,
        main,
        .selected {
          grid-template-columns: 1fr;
        }

        header {
          align-items: stretch;
          display: grid;
        }

        main,
        .grid,
        .grid.wide {
          grid-template-columns: 1fr;
        }

        .toolbar input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Comfy Shell</h1>
      <div class="row toolbar">
        <input id="token" type="password" placeholder="Bearer token" />
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main>
      <div class="stack">
        <section>
          <h2>Hosts</h2>
          <div id="hosts" class="list"></div>
        </section>
        <section>
          <h2>Runtime</h2>
          <div id="runtime" class="kv muted"></div>
        </section>
        <section>
          <h2>Model Roots</h2>
          <div class="stack">
            <label>Label <input id="model-label" value="Shared Models" /></label>
            <label>Path <input id="model-path" /></label>
            <button id="create-model-root" type="button">Add Model Root</button>
            <div id="model-roots" class="list"></div>
          </div>
        </section>
      </div>
      <div class="stack">
        <section>
          <h2>Instances</h2>
          <div class="stack">
            <div class="grid">
              <label>Name <input id="instance-name" value="Comfy Prod" /></label>
              <label>Slug <input id="instance-slug" value="comfy-prod" /></label>
              <label
                >Version
                <select id="instance-version"></select>
              </label>
              <label
                >Runtime
                <select id="instance-runtime"></select>
              </label>
              <label>GPU <input id="instance-gpu" placeholder="0" /></label>
              <label>Port <input id="instance-port" type="number" value="8188" /></label>
            </div>
            <details id="advanced-runtime">
              <summary>Advanced exact values</summary>
              <div class="stack" style="margin-top: 10px">
                <label class="row" style="justify-content: flex-start">
                  <input id="advanced-enabled" type="checkbox" style="min-height: 16px; width: auto" />
                  Use exact ref/runtime
                </label>
                <div class="grid wide">
                  <label>Ref <input id="instance-ref" placeholder="tag, branch, or commit" /></label>
                  <label>Python <input id="instance-python" placeholder="3.12" /></label>
                  <label
                    >Torch
                    <select id="instance-torch"></select>
                  </label>
                </div>
              </div>
            </details>
            <button id="create-instance" type="button">Create Instance</button>
            <button id="stop-running" class="secondary" type="button">Stop Running</button>
            <div id="instances" class="list"></div>
          </div>
        </section>
        <section>
          <h2>Selected Instance</h2>
          <div class="selected">
            <div class="stack">
              <div id="selected-instance" class="kv muted"></div>
              <div class="grid wide">
                <label
                  >Reinstall Version
                  <select id="selected-version"></select>
                </label>
                <label>Launch Port <input id="launch-port" type="number" /></label>
                <label>Launch GPU <input id="launch-gpu" placeholder="0" /></label>
              </div>
              <button id="save-launch-config" class="secondary" type="button">Save Launch Config</button>
            </div>
            <div class="row">
              <button id="install" type="button">Install</button>
              <button id="reinstall" type="button">Reinstall</button>
              <button id="start" type="button">Start</button>
              <button id="stop" type="button">Stop</button>
              <button id="status" class="secondary" type="button">Status</button>
              <button id="ready" class="secondary" type="button">Ready</button>
              <button id="logs" class="secondary" type="button">Logs</button>
            </div>
          </div>
        </section>
        <section>
          <h2>Output</h2>
          <pre id="output"></pre>
        </section>
      </div>
    </main>
    <script>
      const state = {
        catalog: null,
        hosts: [],
        modelRoots: [],
        instances: [],
        instanceStatuses: {},
        hostProbes: {},
        selectedHostId: null,
        selectedInstanceId: null,
        userEditedVersion: false,
        userEditedRuntime: false,
        userEditedGpu: false,
        busy: false,
      };
      const apiPrefix = "__API_PREFIX__";
      const output = document.querySelector("#output");
      const modelPathInput = document.querySelector("#model-path");
      const createModelRootButton = document.querySelector("#create-model-root");
      const createInstanceButton = document.querySelector("#create-instance");
      const stopRunningButton = document.querySelector("#stop-running");
      const advancedEnabled = document.querySelector("#advanced-enabled");
      const instanceVersion = document.querySelector("#instance-version");
      const instanceRuntime = document.querySelector("#instance-runtime");
      const selectedVersion = document.querySelector("#selected-version");
      const saveLaunchConfigButton = document.querySelector("#save-launch-config");
      const actionButtons = {
        install: document.querySelector("#install"),
        reinstall: document.querySelector("#reinstall"),
        start: document.querySelector("#start"),
        stop: document.querySelector("#stop"),
        status: document.querySelector("#status"),
        ready: document.querySelector("#ready"),
        logs: document.querySelector("#logs"),
      };

      function headers() {
        const token = document.querySelector("#token").value.trim();
        const values = { "Content-Type": "application/json" };
        if (token) values.Authorization = `Bearer ${token}`;
        return values;
      }

      function show(value) {
        output.textContent = JSON.stringify(value, null, 2);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function shortRef(ref) {
        if (!ref) return "";
        return /^[0-9a-f]{40}$/i.test(ref) ? ref.slice(0, 12) : ref;
      }

      async function request(path, options = {}, display = true) {
        let response;
        try {
          response = await fetch(`${apiPrefix}${path}`, { ...options, headers: headers() });
        } catch (caught) {
          const body = {
            code: "NETWORK_ERROR",
            message: "Request failed before receiving a response.",
            details: { path, error: caught?.message || String(caught) },
          };
          if (display) show(body);
          const error = new Error(body.code);
          error.body = body;
          throw error;
        }
        let body;
        try {
          body = await response.json();
        } catch (caught) {
          body = {
            code: "RESPONSE_INVALID",
            message: "Response is not valid JSON.",
            details: { path, status: response.status, status_text: response.statusText, error: caught?.message || String(caught) },
          };
          show(body);
          const error = new Error(body.code);
          error.body = body;
          throw error;
        }
        if (!response.ok && body.code === "UNAUTHORIZED") {
          body.details = {
            ...(body.details || {}),
            hint: "Use SECURITY__SERVICE_API_KEY from the remote .env as the Bearer token.",
          };
        }
        if (display || !response.ok) show(body);
        if (!response.ok) {
          const error = new Error(body.code || response.statusText);
          error.body = body;
          throw error;
        }
        return body.data;
      }

      async function withBusy(work) {
        if (state.busy) return;
        state.busy = true;
        syncControls();
        try {
          await work();
        } finally {
          state.busy = false;
          syncControls();
        }
      }

      function selectedHost() {
        return state.hosts.find((host) => host.id === state.selectedHostId) || null;
      }

      function selectedInstance() {
        return state.instances.find((instance) => instance.id === state.selectedInstanceId) || null;
      }

      function selectedProbe() {
        return state.hostProbes[state.selectedHostId] || null;
      }

      function selectedRecommendation() {
        return selectedProbe()?.runtime_recommendation || null;
      }

      function versionById(id) {
        return state.catalog?.versions.find((item) => item.id === id) || null;
      }

      function runtimeById(id) {
        return state.catalog?.runtime_profiles.find((item) => item.id === id) || null;
      }

      function versionByRef(ref) {
        return state.catalog?.versions.find((item) => item.ref === ref) || null;
      }

      function sourceLabel(value) {
        if (value === "release") return "release";
        if (value === "snapshot") return "snapshot";
        if (value === "branch") return "branch";
        return "ref";
      }

      function defaultModelRootPath(host) {
        if (!host) return "";
        return `${host.data_root.replace(/\/+$/, "")}/ComfyUI-Shared/models`;
      }

      function modelRootPathRegistered(path) {
        return state.modelRoots.some((root) => root.path === path);
      }

      function optionText(item) {
        const tags = [];
        if (item.source_type) tags.push(sourceLabel(item.source_type));
        if (item.verified) tags.push("verified");
        if (item.advanced) tags.push("advanced");
        return `${item.label}${tags.length ? ` (${tags.join(", ")})` : ""}`;
      }

      function versionText(instance) {
        const version = versionByRef(instance.comfy_ref);
        if (version) return `${version.label} (${sourceLabel(version.source_type)})`;
        return `Custom ref ${shortRef(instance.comfy_ref)}`;
      }

      function runtimeText(instance) {
        const runtime = state.catalog?.runtime_profiles.find(
          (item) => item.python_version === instance.python_version && item.torch_profile === instance.torch_profile,
        );
        if (runtime) return runtime.label;
        return `${instance.python_version} / ${instance.torch_profile}`;
      }

      function instanceModelRootText(instance) {
        const ids = new Set(instance.model_root_ids || []);
        return state.modelRoots
          .filter((root) => ids.has(root.id))
          .map((root) => `${root.label}: ${root.path}`)
          .join("\n");
      }

      function sshTunnelCommand(instance) {
        return `ssh -L ${instance.comfy_port}:127.0.0.1:${instance.comfy_port} <user@remote-host>`;
      }

      function statusRecord(instance) {
        return state.instanceStatuses[instance.id] || null;
      }

      function lifecycle(instance) {
        const record = statusRecord(instance);
        if (!record) return { key: "unknown", label: "unknown", data: {} };
        if (!record.ok) return { key: "error", label: record.code || "error", data: record.data || {} };
        const data = record.data || {};
        if (data.process_alive) return { key: "running", label: "running", data };
        if (!data.manifest_exists) return { key: "not-installed", label: "not installed", data };
        if (data.port_in_use_by_other) return { key: "port-busy", label: "port busy", data };
        return { key: "stopped", label: "stopped", data };
      }

      function statusBadge(instance) {
        const state = lifecycle(instance);
        return `<span class="pill status-${escapeHtml(state.key)}">${escapeHtml(state.label)}</span>`;
      }

      function canStart(instance) {
        const status = lifecycle(instance).key;
        return status === "stopped";
      }

      function canStop(instance) {
        return lifecycle(instance).key === "running";
      }

      function canEditStoppedConfig(instance) {
        const status = lifecycle(instance).key;
        return status === "stopped" || status === "not-installed" || status === "port-busy";
      }

      function selectedVersionOptions(instance) {
        const visibleVersions = (state.catalog?.versions || []).filter((item) => !item.advanced);
        const currentOption = `<option value="__current__">Current: ${escapeHtml(versionText(instance))}</option>`;
        return [
          currentOption,
          ...visibleVersions.map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(optionText(item))}</option>`),
        ].join("");
      }

      function parseGpuIds(value) {
        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function renderCatalogControls() {
        const currentVersion = instanceVersion.value;
        const currentRuntime = instanceRuntime.value;
        const visibleVersions = (state.catalog?.versions || []).filter((item) => !item.advanced);
        const visibleRuntimes = (state.catalog?.runtime_profiles || []).filter((item) => !item.advanced);
        const versionOptions = visibleVersions
          .map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(optionText(item))}</option>`)
          .join("");
        instanceVersion.innerHTML = versionOptions;
        instanceRuntime.innerHTML = visibleRuntimes
          .map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(optionText(item))}</option>`)
          .join("");
        const torchProfiles = [...new Set((state.catalog?.runtime_profiles || []).map((item) => item.torch_profile))];
        document.querySelector("#instance-torch").innerHTML = torchProfiles
          .map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
          .join("");
        const versionIds = new Set(visibleVersions.map((item) => item.id));
        const runtimeIds = new Set(visibleRuntimes.map((item) => item.id));
        const visibleDefaultVersion = visibleVersions.find((item) => item.recommended) || visibleVersions[0] || null;
        const visibleDefaultRuntime = visibleRuntimes.find((item) => item.recommended) || visibleRuntimes[0] || null;
        instanceVersion.value = versionIds.has(currentVersion) ? currentVersion : visibleDefaultVersion?.id || "";
        instanceRuntime.value = runtimeIds.has(currentRuntime) ? currentRuntime : visibleDefaultRuntime?.id || "";
        syncAdvancedFields();
      }

      function syncAdvancedFields() {
        if (advancedEnabled.checked) return;
        const version = versionById(instanceVersion.value);
        const runtime = runtimeById(instanceRuntime.value);
        if (version) document.querySelector("#instance-ref").value = version.ref;
        if (runtime) {
          document.querySelector("#instance-python").value = runtime.python_version;
          document.querySelector("#instance-torch").value = runtime.torch_profile;
        }
      }

      function applyRuntimeRecommendation() {
        const recommendation = selectedRecommendation();
        if (!recommendation) return;
        if (!state.userEditedVersion && recommendation.version_id) {
          instanceVersion.value = recommendation.version_id;
        }
        if (!state.userEditedRuntime && recommendation.runtime_profile_id) {
          instanceRuntime.value = recommendation.runtime_profile_id;
        }
        if (!state.userEditedGpu && Array.isArray(recommendation.gpu_ids)) {
          document.querySelector("#instance-gpu").value = recommendation.gpu_ids.join(",");
        }
        syncAdvancedFields();
      }

      function syncControls() {
        const hasHost = Boolean(selectedHost());
        const instance = selectedInstance();
        const hasInstance = Boolean(instance);
        const modelPath = modelPathInput.value || modelPathInput.placeholder;
        createModelRootButton.disabled = state.busy || !hasHost || !modelPath || modelRootPathRegistered(modelPath);
        createInstanceButton.disabled = state.busy || !hasHost || !instanceVersion.value || !instanceRuntime.value;
        stopRunningButton.disabled = state.busy || !state.instances.some((item) => canStop(item));
        actionButtons.install.disabled = state.busy || !hasInstance || !canEditStoppedConfig(instance);
        actionButtons.reinstall.disabled = state.busy || !hasInstance || !canEditStoppedConfig(instance);
        actionButtons.start.disabled = state.busy || !hasInstance || !canStart(instance);
        actionButtons.stop.disabled = state.busy || !hasInstance || !canStop(instance);
        actionButtons.status.disabled = state.busy || !hasInstance;
        actionButtons.ready.disabled = state.busy || !hasInstance;
        actionButtons.logs.disabled = state.busy || !hasInstance;
        saveLaunchConfigButton.disabled =
          state.busy || !hasInstance || !canEditStoppedConfig(instance) || !document.querySelector("#launch-port").value;
        selectedVersion.disabled = state.busy || !hasInstance || !canEditStoppedConfig(instance);
        modelPathInput.placeholder = hasHost ? defaultModelRootPath(selectedHost()) : "";
        if (hasHost && !modelPathInput.value) {
          modelPathInput.value = defaultModelRootPath(selectedHost());
        }
      }

      function renderHosts() {
        document.querySelector("#hosts").innerHTML = state.hosts
          .map(
            (host) => `<div class="item ${host.id === state.selectedHostId ? "active" : ""}" data-host="${escapeHtml(host.id)}">
              <strong>${escapeHtml(host.name)}</strong>
              <div class="muted">${escapeHtml(host.connection)} | ${escapeHtml(host.data_root)}</div>
            </div>`,
          )
          .join("");
        document.querySelectorAll("[data-host]").forEach((node) => {
          node.addEventListener("click", async () => {
            if (state.selectedHostId === node.dataset.host) return;
            state.selectedHostId = node.dataset.host;
            state.selectedInstanceId = null;
            state.modelRoots = [];
            state.instances = [];
            state.userEditedVersion = false;
            state.userEditedRuntime = false;
            state.userEditedGpu = false;
            modelPathInput.value = defaultModelRootPath(selectedHost());
            renderHosts();
            renderRuntime();
            renderModelRoots();
            renderInstances();
            await loadHostResources(state.selectedHostId);
          });
        });
        syncControls();
      }

      function renderRuntime() {
        const host = selectedHost();
        const probe = selectedProbe();
        const recommendation = selectedRecommendation();
        const gpus = probe?.gpus || [];
        const gpuIds = Array.isArray(recommendation?.gpu_ids) ? recommendation.gpu_ids.join(",") : "";
        const warnings = Array.isArray(recommendation?.warnings) ? recommendation.warnings.join("; ") : "";
        document.querySelector("#runtime").innerHTML = host
          ? [
              `<div><strong>Data Root</strong><span>${escapeHtml(host.data_root)}</span></div>`,
              `<div><strong>Driver</strong><span>${escapeHtml(probe?.driver_version || "unknown")}</span></div>`,
              `<div><strong>CUDA</strong><span>${escapeHtml(probe?.cuda_version || "unknown")}</span></div>`,
              `<div><strong>GPU</strong><span>${escapeHtml(gpus.map((gpu) => `${gpu.index}: ${gpu.name}`).join(", ") || "none")}</span></div>`,
              `<div><strong>Version</strong><span>${escapeHtml(recommendation?.version_label || "pending")} (${escapeHtml(sourceLabel(recommendation?.version_source_type))})</span></div>`,
              `<div><strong>Runtime</strong><span>${escapeHtml(recommendation?.runtime_profile_label || "pending")}</span></div>`,
              `<div><strong>GPU IDs</strong><span>${escapeHtml(gpuIds || "none")}</span></div>`,
              `<div><strong>Reason</strong><span>${escapeHtml(recommendation?.reason || "pending")}</span></div>`,
              `<div><strong>Warning</strong><span>${escapeHtml(warnings || "none")}</span></div>`,
              `<div><strong>Error</strong><span>${escapeHtml(probe?.nvidia_smi_error || "none")}</span></div>`,
            ].join("")
          : "";
      }

      function renderModelRoots() {
        document.querySelector("#model-roots").innerHTML = state.modelRoots
          .map((root) => `<div class="item"><strong>${escapeHtml(root.label)}</strong><div class="muted">${escapeHtml(root.path)}</div></div>`)
          .join("");
        syncControls();
      }

      function renderSelectedInstance() {
        const item = selectedInstance();
        const modelRoots = item ? instanceModelRootText(item) : "";
        const life = item ? lifecycle(item) : null;
        const statusData = life?.data || {};
        const openUrl = statusData.open_url || `http://127.0.0.1:${item?.comfy_port || ""}/`;
        const openValue =
          item && life?.key === "running"
            ? `<a href="${escapeHtml(openUrl)}" target="_blank" rel="noreferrer">${escapeHtml(openUrl)}</a>`
            : escapeHtml(openUrl);
        if (item) {
          selectedVersion.innerHTML = selectedVersionOptions(item);
          selectedVersion.value = "__current__";
          document.querySelector("#launch-port").value = item.comfy_port;
          document.querySelector("#launch-gpu").value = (item.gpu_ids || []).join(",");
        } else {
          selectedVersion.innerHTML = "";
          document.querySelector("#launch-port").value = "";
          document.querySelector("#launch-gpu").value = "";
        }
        document.querySelector("#selected-instance").innerHTML = item
          ? [
              `<div><strong>Name</strong><span>${escapeHtml(item.name)}</span></div>`,
              `<div><strong>State</strong><span>${statusBadge(item)}</span></div>`,
              `<div><strong>Version</strong><span>${escapeHtml(versionText(item))}</span></div>`,
              `<div><strong>Ref</strong><span>${escapeHtml(shortRef(item.comfy_ref))}${item.resolved_commit ? ` -> ${escapeHtml(shortRef(item.resolved_commit))}` : ""}</span></div>`,
              `<div><strong>Install</strong><span>${escapeHtml(item.install_root)}</span></div>`,
              `<div><strong>Runtime</strong><span>${escapeHtml(runtimeText(item))}</span></div>`,
              `<div><strong>Model Roots</strong><span>${escapeHtml(modelRoots || "none")}</span></div>`,
              `<div><strong>PID</strong><span>${escapeHtml(statusData.pid || "none")}</span></div>`,
              `<div><strong>Port</strong><span>${escapeHtml(item.comfy_port)}${statusData.port_in_use_by_other ? " | occupied by another process" : ""}</span></div>`,
              `<div><strong>Log</strong><span>${escapeHtml(statusData.log_path || "pending")}</span></div>`,
              `<div><strong>Open</strong><span>${openValue}</span></div>`,
              `<div><strong>SSH Tunnel</strong><span>${escapeHtml(sshTunnelCommand(item))}</span></div>`,
            ].join("")
          : "";
      }

      function renderInstances() {
        if (!selectedInstance()) {
          state.selectedInstanceId = state.instances[0]?.id || null;
        }
        document.querySelector("#instances").innerHTML = state.instances
          .map(
            (item) => `<div class="item ${item.id === state.selectedInstanceId ? "active" : ""}" data-instance="${escapeHtml(item.id)}">
              <strong>${escapeHtml(item.name)}</strong>
              <div class="muted">
                <span class="pill">${escapeHtml(item.instance_slug)}</span>
                ${statusBadge(item)}
                ${escapeHtml(versionText(item))} | ${escapeHtml(runtimeText(item))} | port ${escapeHtml(item.comfy_port)}
              </div>
              <div class="muted">${escapeHtml(item.install_root)}</div>
            </div>`,
          )
          .join("");
        document.querySelectorAll("[data-instance]").forEach((node) => {
          node.addEventListener("click", () => {
            state.selectedInstanceId = node.dataset.instance;
            renderInstances();
          });
        });
        renderSelectedInstance();
        syncControls();
      }

      async function loadInstanceStatuses() {
        const statuses = {};
        for (const item of state.instances) {
          try {
            const status = await request(`/instances/${encodeURIComponent(item.id)}/status`, {}, false);
            statuses[item.id] = { ok: true, data: status.data || {} };
          } catch (error) {
            statuses[item.id] = {
              ok: false,
              code: error.body?.code || error.message,
              data: error.body?.details?.data || {},
            };
          }
        }
        state.instanceStatuses = statuses;
      }

      async function loadCatalog() {
        state.catalog = await request("/catalog", {}, false);
        renderCatalogControls();
      }

      async function loadHostResources(hostId) {
        if (!hostId) {
          state.modelRoots = [];
          state.instances = [];
          state.instanceStatuses = {};
          renderRuntime();
          renderModelRoots();
          renderInstances();
          return;
        }
        const hostParam = encodeURIComponent(hostId);
        const probe = await request(`/hosts/${hostParam}/probe`, { method: "POST", body: JSON.stringify({}) });
        if (state.selectedHostId !== hostId) return;
        state.hostProbes[hostId] = probe.data;
        applyRuntimeRecommendation();
        renderRuntime();
        const roots = await request(`/model-roots?host_id=${hostParam}`, {}, false);
        if (state.selectedHostId !== hostId) return;
        state.modelRoots = roots.model_roots;
        renderModelRoots();
        const instances = await request(`/instances?host_id=${hostParam}`);
        if (state.selectedHostId !== hostId) return;
        state.instances = instances.instances;
        await loadInstanceStatuses();
        if (state.selectedHostId !== hostId) return;
        renderInstances();
      }

      async function refresh() {
        await withBusy(async () => {
          await loadCatalog();
          const hosts = await request("/hosts", {}, false);
          state.hosts = hosts.hosts;
          if (!selectedHost()) {
            state.selectedHostId = state.hosts[0]?.id || null;
            state.selectedInstanceId = null;
            state.userEditedVersion = false;
            state.userEditedRuntime = false;
            state.userEditedGpu = false;
          }
          modelPathInput.value = defaultModelRootPath(selectedHost());
          renderHosts();
          renderRuntime();
          await loadHostResources(state.selectedHostId);
        });
      }

      document.querySelector("#refresh").addEventListener("click", refresh);
      modelPathInput.addEventListener("input", syncControls);
      instanceVersion.addEventListener("change", () => {
        state.userEditedVersion = true;
        syncAdvancedFields();
      });
      instanceRuntime.addEventListener("change", () => {
        state.userEditedRuntime = true;
        syncAdvancedFields();
      });
      advancedEnabled.addEventListener("change", () => {
        if (!advancedEnabled.checked) syncAdvancedFields();
      });
      document.querySelector("#instance-gpu").addEventListener("input", () => {
        state.userEditedGpu = true;
      });
      document.querySelector("#create-model-root").addEventListener("click", async () => {
        await withBusy(async () => {
          if (!selectedHost()) {
            show({ code: "HOST_NOT_SELECTED", message: "Select a host first." });
            return;
          }
          await request("/model-roots", {
            method: "POST",
            body: JSON.stringify({
              host_id: state.selectedHostId,
              label: document.querySelector("#model-label").value,
              path: document.querySelector("#model-path").value,
            }),
          });
          await loadHostResources(state.selectedHostId);
        });
      });
      document.querySelector("#create-instance").addEventListener("click", async () => {
        await withBusy(async () => {
          if (!selectedHost()) {
            show({ code: "HOST_NOT_SELECTED", message: "Select a host first." });
            return;
          }
          const payload = {
            host_id: state.selectedHostId,
            name: document.querySelector("#instance-name").value,
            instance_slug: document.querySelector("#instance-slug").value,
            comfy_port: Number(document.querySelector("#instance-port").value),
            gpu_ids: parseGpuIds(document.querySelector("#instance-gpu").value),
            model_root_ids: state.modelRoots.map((item) => item.id),
          };
          if (advancedEnabled.checked) {
            payload.comfy_ref = document.querySelector("#instance-ref").value || null;
            payload.python_version = document.querySelector("#instance-python").value || null;
            payload.torch_profile = document.querySelector("#instance-torch").value || null;
          } else {
            payload.comfy_version_id = instanceVersion.value;
            payload.runtime_profile_id = instanceRuntime.value;
          }
          await request("/instances", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          await loadHostResources(state.selectedHostId);
        });
      });
      document.querySelector("#stop-running").addEventListener("click", async () => {
        await withBusy(async () => {
          const running = state.instances.filter((item) => canStop(item));
          const results = [];
          let refreshError = null;
          for (const item of running) {
            try {
              const result = await request(`/instances/${encodeURIComponent(item.id)}/stop`, {
                method: "POST",
                body: JSON.stringify({}),
              }, false);
              results.push({ instance_id: item.id, instance_slug: item.instance_slug, code: "OK", run: result });
            } catch (error) {
              results.push({
                instance_id: item.id,
                instance_slug: item.instance_slug,
                code: error.body?.code || error.message,
                error: error.body || { message: error.message },
              });
            }
          }
          try {
            await loadHostResources(state.selectedHostId);
          } catch (error) {
            refreshError = error.body || { code: error.message || "REFRESH_FAILED" };
          }
          const failed = results.filter((item) => item.code !== "OK");
          show({
            code: failed.length || refreshError ? "PARTIAL_FAILURE" : "OK",
            stopped_instances: results.length - failed.length,
            failed_instances: failed.length,
            runs: results,
            refresh_error: refreshError,
          });
        });
      });
      document.querySelector("#save-launch-config").addEventListener("click", async () => {
        await withBusy(async () => {
          if (!selectedInstance()) {
            show({ code: "INSTANCE_NOT_SELECTED", message: "Select an instance first." });
            return;
          }
          await request(`/instances/${state.selectedInstanceId}/launch-config`, {
            method: "PATCH",
            body: JSON.stringify({
              comfy_port: Number(document.querySelector("#launch-port").value),
              gpu_ids: parseGpuIds(document.querySelector("#launch-gpu").value),
            }),
          });
          await loadHostResources(state.selectedHostId);
        });
      });
      for (const action of ["install", "reinstall", "start", "stop"]) {
        document.querySelector(`#${action}`).addEventListener("click", async () => {
          await withBusy(async () => {
            const instance = selectedInstance();
            if (!instance) {
              show({ code: "INSTANCE_NOT_SELECTED", message: "Select an instance first." });
              return;
            }
            const body =
              action === "reinstall" && selectedVersion.value !== "__current__"
                ? { comfy_version_id: selectedVersion.value }
                : {};
            show({ code: "RUNNING", action, instance_slug: instance.instance_slug, message: `${action} request started.` });
            await request(`/instances/${state.selectedInstanceId}/${action}`, { method: "POST", body: JSON.stringify(body) });
            await loadHostResources(state.selectedHostId);
          });
        });
      }
      for (const action of ["status", "ready", "logs"]) {
        document.querySelector(`#${action}`).addEventListener("click", async () => {
          await withBusy(async () => {
            if (!selectedInstance()) {
              show({ code: "INSTANCE_NOT_SELECTED", message: "Select an instance first." });
              return;
            }
            await request(`/instances/${state.selectedInstanceId}/${action}`);
          });
        });
      }
      renderCatalogControls();
      syncControls();
      refresh().catch((error) => {
        if (!output.textContent) show({ code: error.message || "REFRESH_FAILED" });
      });
    </script>
  </body>
</html>
